# Build and test on every push / pull request; a tag v* publishes a release with karabas_gopher.spg
# and the notes of that version from CHANGELOG.md.
name: build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools (SDCC 4.2, sjasmplus 1.20.1, Pillow, dosfstools)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sdcc python3-pil dosfstools
          git clone -q --depth 1 --branch v1.20.1 https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          make -s -C "$RUNNER_TEMP/sjasmplus" -j4 USE_LUA=0
          sdcc -v | head -1
      - name: Build
        run: make SJASM="$RUNNER_TEMP/sjasmplus/sjasmplus"
      - name: Test
        run: make test SJASM="$RUNNER_TEMP/sjasmplus/sjasmplus"
      - name: Artifact
        run: cp build/gopher.spg karabas_gopher.spg
      - uses: actions/upload-artifact@v4
        with:
          name: karabas_gopher
          path: karabas_gopher.spg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$v" = "$(cat VERSION)"
          awk -v v="$v" '$0 ~ "^## " v " " {p = 1; next} /^## / {p = 0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" karabas_gopher.spg --title "karabas gopher $v" --notes-file notes.md
